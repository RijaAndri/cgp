name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: netlify-production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Package site
        run: zip -r site.zip index.html merci.html netlify.toml assets

      # Direct API call rather than netlify-cli or a third-party action: no dependency tree to trust.
      - name: Deploy
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          api="https://api.netlify.com/api/v1"
          auth="Authorization: Bearer $NETLIFY_AUTH_TOKEN"

          deploy_id=$(curl -sS --fail-with-body \
            -H "$auth" -H "Content-Type: application/zip" \
            --data-binary @site.zip \
            "$api/sites/$NETLIFY_SITE_ID/deploys?title=${GITHUB_SHA::7}" | jq -r .id)

          # Zip deploys are processed asynchronously; wait for the final state.
          for _ in $(seq 1 60); do
            deploy=$(curl -sS --fail-with-body -H "$auth" "$api/deploys/$deploy_id")
            state=$(jq -r .state <<<"$deploy")
            [[ "$state" == ready || "$state" == error ]] && break
            sleep 3
          done

          if [[ "$state" != ready ]]; then
            echo "::error::Netlify deploy $deploy_id ended in state '$state': $(jq -r '.error_message // empty' <<<"$deploy")"
            exit 1
          fi

          url=$(jq -r .ssl_url <<<"$deploy")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $deploy_id to $url" >> "$GITHUB_STEP_SUMMARY"
